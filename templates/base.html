<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Expository Papers{% endblock %} · {{ author }}</title>
    <meta name="author" content="{{ author }}" />
    <meta
      name="description"
      content="Expository papers by {{ author }}, {{ department }}, {{ institution }}."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="gold-bar"></div>
    <header class="site-header">
      <div class="brand">
        <a class="brand-copy" href="{{ url_for('home') }}">
          <p class="school">{{ institution }}</p>
          <p class="dept">{{ department }}</p>
        </a>
      </div>
      <nav class="nav">
        <a href="{{ url_for('home') }}">Papers</a>
        <a href="{{ url_for('about') }}">About</a>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div>
        <strong>{{ author }}</strong>
        <span>{{ department }}</span>
        <span>{{ institution }}</span>
      </div>
      <p>Archive of original expository papers. {{ paper_count }} works listed.</p>
    </footer>
  </body>
</html>
